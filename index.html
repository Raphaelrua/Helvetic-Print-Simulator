<style>
/* Layout: Entscheidungsspalte links (Formular), Ergebnisse rechts in Tabs; auf dem Handy untereinander. Farben nach Druckfarben: Cyan als Akzent, Magenta für Hinweise. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15212b; --muted:#5b6b78; --line:#d9e0e6; --soft:#e9eef2;

  --good:#4cc283; --warn:#e3a443; --bad:#f06b8f; --good-soft:#15301f; --warn-soft:#33270f; --bad-soft:#3a1622;
  --input:#111b23; --bar:#0a141d; --bar-ink:#e6edf2; --hot:#ff7070; --side:#1b252e; --side-ink:#d9e2e9; --side-on:#26333f; --head-row:#1d5f8a; --head-ink:#ffffff; --cur-col:#1a2c3a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#162029; --ink:#e6edf2; --muted:#93a4b1; --line:#2a3946; --soft:#1d2a35;
  --accent:#3bb6dd; --accent-ink:#06202b; --accent-soft:#143341;
  --good:#4cc283; --warn:#e3a443; --bad:#f06b8f; --good-soft:#15301f; --warn-soft:#33270f; --bad-soft:#3a1622;
  --input:#111b23; --bar:#0a141d; --bar-ink:#e6edf2; --hot:#ff7070; --side:#1b252e; --side-ink:#d9e2e9; --side-on:#26333f; --head-row:#1d5f8a; --head-ink:#ffffff; --cur-col:#1a2c3a; color-scheme:dark}
*{box-sizing:border-box}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:14px;min-height:52px;flex-wrap:wrap;

.top .menu{display:none;background:none;border:0;color:var(--bar-ink);cursor:pointer;padding:6px}

.top .sp{flex:1}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 52px)}

<body>
<header class="top">
  <button class="menu" id="menu" aria-label="Menü ein- und ausblenden" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <span class="brand">Helvetic Print Simulator<small>Planspiel UF5</small></span>
  <span class="sp"></span>
  <span class="co">Unternehmen 2 (Helvetic Print AG)</span>
  <nav class="pnums" id="periods" aria-label="Periode wählen"></nav>
</header>
<div class="shell">
  <aside class="side" id="side">
    <nav class="nav" id="nav" aria-label="Bereiche"></nav>
    <div class="meta">Eigenes Rechenmodell, abgestimmt auf die Berichte P0 und P1. Simulierte Werte sind Schätzungen.</div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="tip" hidden></div>

<script>
/*ENGINE-START*/
const GEB_AFA = 1.0, MIN_CASH = 0.1, FIX_EQ = 24.0;

function clone(o){return JSON.parse(JSON.stringify(o));}
function techGain(k, ma, a){return ma>0 ? k*Math.pow(ma, a) : 0;}
function interp(table, x){
  if (x >= table[table.length-1][0]) return table[table.length-1][1];
  if (x <= table[0][0]) return table[0][1];
  for (let i=1;i<table.length;i++){ if (x <= table[i][0]){ const [x0,y0]=table[i-1],[x1,y1]=table[i]; return y0+(y1-y0)*(x-x0)/(x1-x0);} }
  return 0;
}
function tierPrice(par, sup, qty, gen2){
  if (sup===0) return par.legacyPrice;
  const tiers = par.matTiers[sup]; // [[limit, g1, g2], ...]
  for (const t of tiers){ if (qty <= t[0]) return gen2 ? t[2] : t[1]; }
  const last = tiers[tiers.length-1]; return gen2 ? last[2] : last[1];
}
function sozialCost(fires, start, par){
  if (fires<=0 || start<=0) return 0;
  const thr = par.spThreshold*start; const extra = Math.max(0, fires-thr); if (extra<=0) return 0;
  const share = fires/start; const per = share<0.3 ? 15000 : share<0.5 ? 20000 : 25000;
  return extra*per/1e6;
}
function ratingFor(ekq, jue, uekShare){
  const cls=['CCC','B','BB','BBB','A','AA'];
  let i = ekq>=0.7?4 : ekq>=0.55?3 : ekq>=0.33?2 : ekq>=0.2?1 : 0;
  if (jue<0) i--; if (uekShare>0.6) i--;
  return cls[Math.max(0,i)];
}

function simulate(S, P, D){
  const W = [], R = {};
  const gen2 = D.product === 'G2';
  const launch = gen2 && S.product !== 'G2';
  // --- F&E
  const techG1 = S.techG1 + techGain(P.kTech1, D.feG1, P.techAlpha);
  const techG2 = S.techG2 + techGain(P.kTech2, D.feG2, P.techAlpha);
  const tech = gen2 ? techG2 : techG1;
  if (gen2 && techG2 < techG1) W.push(['bad','Gen. 2 liegt technisch unter Gen. 1','Die Einführung lohnt sich laut Prognose erst, wenn der Index über dem Vorgänger liegt.']);
  if (gen2 && techG2 < 100) W.push(['bad','Gen. 2 nicht marktreif','Technologieindex unter 100: Kunden meiden das Produkt.']);
  // --- Anlagen
  const sold = S.machines.filter(m => (D.sell||[]).includes(m.id));
  let machines = S.machines.filter(m => !(D.sell||[]).includes(m.id)).map(m => ({...m}));
  const desinvErl = sold.reduce((a,m)=>a+m.rbw*m.rest,0);
  const aoAfa = sold.reduce((a,m)=>a+m.rbw*(1-m.rest),0);
  let invest = 0;
  for (const typ of ['A','B']){
    const n = typ==='A'?D.buyA:D.buyB; const c = P.machCat[typ];
    for (let i=0;i<n;i++){
      const cnt = machines.filter(m=>m.typ===typ).length + S.machines.filter(m=>m.typ===typ && (D.sell||[]).includes(m.id)).length;
      const ids = [...S.machines, ...machines].filter(m=>m.typ===typ).map(m=>+m.id.slice(1));
      const id = typ + (Math.max(0,...ids)+1);
      machines.push({id, typ, cap:c.cap, rbw:c.price, rl:c.life, afa:c.price/c.life, fix:c.fix, ui:c.ui, rest:c.rest, isNew:true});
      invest += c.price;
    }
    if (machines.filter(m=>m.typ===typ).length > 9) W.push(['bad',`Mehr als 9 Anlagen Typ ${typ}`,'Pro Typ sind höchstens neun Anlagen erlaubt.']);
  }
  if (machines.length===0) W.push(['bad','Keine Anlage mehr','Mindestens eine Anlage muss im Bestand bleiben.']);
  const ratIdx = {A: S.ratIdx.A + (D.ratA>0 ? 0.05*Math.pow(D.ratA,0.7) : 0), B: S.ratIdx.B + (D.ratB>0 ? 0.05*Math.pow(D.ratB,0.7) : 0)};
  const machCap = machines.reduce((a,m)=>a+m.cap*(ratIdx[m.typ]||1)*P.avail,0);
  const afaMach = machines.reduce((a,m)=>a+(m.rl>0?m.afa:0),0);
  const machFix = machines.reduce((a,m)=>a+m.fix,0);
  const uiAvg = machines.length ? machines.reduce((a,m)=>a+m.ui,0)/machines.length : 100;
  const umwelt = interp(P.umweltTable, uiAvg);
  // --- Personal Fertigung
  const flF = Math.round(P.fl.fert*S.staff.fert);
  const fertEnd = Math.max(0, S.staff.fert + D.hires - D.fires - flF);
  const newShare = fertEnd>0 ? D.hires/fertEnd : 0;
  const einarb = 1 - (1-P.newProd)*newShare;
  const prozIdx = S.prozIdx + (D.prozOpt>0 ? 0.04*Math.pow(D.prozOpt/3,0.7) : 0);
  const qualIdx = 1 + P.trainEff*D.training;
  const prodI = einarb*qualIdx*prozIdx*P.motiv;
  const prodPerMA = (gen2?P.prodG2:P.prodG1)*prodI*P.prodII;
  const fehl = fertEnd*P.fehl, einsetzbar = fertEnd - fehl;
  const capUnit = gen2 ? P.capG2 : 1;
  const maxMach = machCap*(1+P.otMach)/capUnit;
  const maxStaff = einsetzbar*(1+P.otStaff)*prodPerMA;
  let prod = Math.max(0, Math.min(D.prod, maxMach, maxStaff));
  if (prod < D.prod - 0.5){
    const lim = maxMach < maxStaff ? 'Anlagenkapazität' : 'Personal';
    W.push(['bad',`Produktion gekürzt auf ${fmt(prod,0)} Stk`,`Engpass: ${lim}. Geplant waren ${fmt(D.prod,0)} Stk. Max. Anlagen ${fmt(maxMach,0)}, max. Personal ${fmt(maxStaff,0)} (inkl. Überstunden).`]);
  }
  const needMA = prodPerMA>0 ? prod/prodPerMA : 0;
  const otMA = Math.max(0, needMA - einsetzbar);
  const otUsed = otMA > 0.5 || prod*capUnit > machCap + 0.5;
  if (otUsed) W.push(['warn','Überstunden nötig',`Zusatzschicht ${fmt(P.otFix,2)} MEUR plus Zuschläge auf ${fmt(otMA,0)} MA-Äquivalente. Mehr Personal oder Kapazität kann günstiger sein.`]);
  // --- Markt 1
  const priceEff = Math.max(1, D.price);
  const pAvg=(5*P.cP+priceEff)/6, wAvg=(5*P.cW+Math.max(D.adv,0.01))/6, vAvg=(5*P.cV+Math.max(D.vt1,1))/6, tAvg=(5*P.cT+tech)/6;
  // HB 3.1.3: reaktionsarmer Bereich ±5 % um den Branchenpreis, ausserhalb reagiert die Nachfrage stärker
  const px = Math.log(priceEff/pAvg), band = Math.log(1+P.band);
  const pxEff = Math.abs(px) <= band ? px : Math.sign(px)*(band + P.eOut*(Math.abs(px)-band));
  const share = Math.exp(-P.e*pxEff + P.w*Math.log(Math.max(D.adv,0.01)/wAvg) + P.v*Math.log(Math.max(D.vt1,1)/vAvg) + P.t*(tech-tAvg));
  const marketBase = S.marketBase*(1+P.growth);
  const base = marketBase*Math.pow(pAvg/P.refPrice, -P.me);
  const ciF = 1 + P.ciEff*Math.log(1+D.ci);
  const launchF = launch ? 1+P.launchBoost : 1;
  let d1 = D.vt1>0 ? base*share*ciF*launchF*(1+P.adj) + P.redis : 0;
  // --- Markt 2
  let d2 = 0, p2eur = 0;
  if (D.m2 && D.vt2>0 && D.p2>0){
    p2eur = D.p2 / P.fx;
    d2 = P.m2Base * Math.pow(p2eur/P.m2Ref, -P.m2e) * (D.adv2>0 ? Math.pow(D.adv2/P.m2W, P.w) : 1) * Math.pow(D.vt2/P.m2V, P.v);
  }
  // --- Lager und Absatz
  const fgWrite = launch ? S.fgValue : 0;
  const fgStart = launch ? 0 : S.fgStock, fgStartVal = launch ? 0 : S.fgValue;
  const avail = fgStart + prod;
  const ga = Math.min(D.ga, P.gaMax, avail);
  if (D.ga > P.gaMax) W.push(['warn','Grossabnehmer: Menge über Angebot',`Angebot nur bis ${fmt(P.gaMax,0)} Stk.`]);
  const s1 = Math.min(d1, avail-ga);
  const s2 = Math.min(d2, avail-ga-s1);
  const sold_ = ga+s1+s2;
  const unmet1 = d1 - s1, unmet2 = d2 - s2;
  if (unmet1 > 50) W.push(['bad',`Lieferunfähig Markt 1: ${fmt(unmet1,0)} Stk`,'Nicht gedeckte Nachfrage geht an die Konkurrenz und senkt die Kundenzufriedenheit der nächsten Periode.']);
  const u1 = s1*D.price/1e6, ugA = ga*P.gaPrice/1e6, u2 = s2*p2eur/1e6;
  const U = u1+ugA+u2;
  // --- übriges Personal
  const ratioU = S.prevRevenue>0 ? U/S.prevRevenue : 1;
  const ekEnd = Math.round(S.staff.ek*Math.pow(ratioU, P.ekEl));
  const vwEnd = Math.round(S.staff.vw*Math.pow(ratioU, P.vwEl));
  const feEnd = D.feG1 + D.feG2, vtEnd = D.vt1 + (D.m2?D.vt2:0);
  const dept = {};
  for (const [k,start,end,rate] of [['ek',S.staff.ek,ekEnd,P.fl.ek],['vw',S.staff.vw,vwEnd,P.fl.vw],['fe',S.staff.fe,feEnd,P.fl.fe],['vt',S.staff.vt,vtEnd,P.fl.vt]]){
    const fl = Math.round(rate*start);
    dept[k] = {start, end, fl, hires:Math.max(0,end-start+fl), fires:Math.max(0,start-fl-end)};
  }
  dept.fert = {start:S.staff.fert, end:fertEnd, fl:flF, hires:D.hires, fires:D.fires};
  const wage = P.wage;
  const loehne = {
    ek: ekEnd*wage.ek/1e3, vw: vwEnd*wage.vw/1e3, fe: feEnd*wage.fe/1e3, vt: vtEnd*wage.vt/1e3,
    fert: fertEnd*wage.fert/1e3 + otMA*wage.fert*P.otFactor/1e3
  };
  const otCost = otMA*wage.fert*P.otFactor/1e3;
  const sumL = Object.values(loehne).reduce((a,b)=>a+b,0);
  const hireCost = Object.values(dept).reduce((a,d)=>a+d.hires,0)*P.hireCost/1e3;
  const fireCost = Object.values(dept).reduce((a,d)=>a+d.fires,0)*P.fireCost/1e3;
  const trainCost = D.training*P.trainCost*fertEnd/1e6;
  let sozial = 0; for (const d of Object.values(dept)) sozial += sozialCost(d.fires, d.start, P);
  const totFires = Object.values(dept).reduce((a,d)=>a+d.fires,0);
  const totStart = Object.values(dept).reduce((a,d)=>a+d.start,0);
  if (totFires > 50 || totFires >= 0.05*totStart) W.push(['bad',`Massenentlassung: ${fmt(totFires,0)} Entlassungen`,'Sozialplan mit der Gewerkschaft schriftlich vereinbaren (Formular). Ohne Vereinbarung über 100 MA: Strafe mind. 1.5 Jahreslöhne pro MA.']);
  const nk = sumL*D.nk, pens = sumL*P.pension;
  const personal = sumL + nk + pens + hireCost + fireCost + trainCost + sozial;
  if (D.nk < 0.37) W.push(['bad','Personalnebenkosten unter 37 %','Der gesetzliche Mindestsatz ist 37 %.']);
  // --- Material
  const matNeed = prod/P.wertIdx;
  const sup = D.supplier;
  const order = sup===0 ? Math.max(0, matNeed - S.matStock) : D.order;
  const price = tierPrice(P, sup, order, gen2);
  const fromStock = Math.min(S.matStock, matNeed);
  const fromOrder = Math.min(order, matNeed-fromStock);
  const short = Math.max(0, matNeed - fromStock - fromOrder);
  const shortPrice = price*(1+(sup===0?0:P.matPrem[sup]));
  const purchase = (order*price + short*shortPrice)/1e6;
  const totUnits = S.matStock + order + short;
  const avgMat = totUnits>0 ? (S.matValue + purchase)/totUnits : price/1e6;
  const matUsedVal = matNeed*avgMat;
  const matEnd = totUnits - matNeed, matEndVal = matEnd*avgMat;
  const quota = sup===0 ? 1 : P.payQuota[sup];
  const matPaidNow = purchase*quota, payablesEnd = purchase*(1-quota);
  if (short > 50) W.push(['warn',`Nachlieferung ${fmt(short,0)} Einheiten`,`Zu wenig bestellt: Aufschlag ${fmt((sup===0?0:P.matPrem[sup])*100,0)} % auf ${fmt(price,0)} EUR.`]);
  if (matEnd > 50) W.push(['warn',`Materiallager ${fmt(matEnd,0)} Einheiten`,`Lagerkosten ${fmt(matEnd*P.lagerMat/1e6,2)} MEUR, Kapital gebunden ${fmt(matEndVal,2)} MEUR.`]);
  const bsPrice = gen2 ? P.bsG2 : P.bsG1;
  const bs = prod*bsPrice/1e6;
  // --- Sonstige Kosten
  const instM = machines.length*P.inst, instVw = P.instVw;
  // HB 3.4.4: Nacharbeit steigt mit Technologieindex und bei Überstunden. P0: 31 EUR/Stk (Index 100, keine Ü.), P1: 48 EUR/Stk (Index 102.66, mit Ü.)
  const nachUnit = P.nachBase*(1 + P.nachTech*(tech-100))*(otUsed ? P.nachOT : 1);
  const nach = prod*nachUnit/1e6;
  const advTot = D.adv + (D.m2?D.adv2:0);
  const mafo = D.mafo ? 0.1 : 0;
  const feBer = D.oekoG1 + D.oekoG2 + D.wert;
  const transport = (s1*P.tr1 + s2*P.tr2)/1e6;
  const fgEnd = avail - sold_;
  const lagerFE = fgEnd*P.lagerFE/1e6, lagerM = matEnd*P.lagerMat/1e6;
  const otFix = otUsed ? P.otFix : 0;
  const sonst = machFix + otFix + instM + instVw + D.ratA + D.ratB + D.prozOpt + umwelt + nach + advTot + mafo + D.ci + feBer + transport + lagerFE + lagerM + P.oneOff;
  // --- Herstellkosten und Lager FE
  const persOf = l => l*(1+D.nk+P.pension);
  const hkEinkauf = matUsedVal + bs + lagerM + persOf(loehne.ek) + dept.ek.hires*P.hireCost/1e3 + 0.05*GEB_AFA;
  const fertPers = persOf(loehne.fert) + (dept.fert.hires*P.hireCost + dept.fert.fires*P.fireCost)/1e3 + trainCost + sozialCost(dept.fert.fires, dept.fert.start, P);
  const hkFert = fertPers + nach + 0.7*GEB_AFA + afaMach + aoAfa + machFix + otFix + instM + D.ratA + D.ratB + D.prozOpt + umwelt;
  const hk = hkEinkauf + hkFert;
  const hkUnit = prod>0 ? hk/prod*1e6 : 0;
  const avgFG = (fgStart+prod)>0 ? (fgStartVal + hk)/(fgStart+prod) : 0;
  const cogs = sold_*avgFG, fgEndVal = fgEnd*avgFG;
  const dBest = fgEndVal - S.fgValue + fgWrite; // Abschreibung FE separat
  const afa = afaMach + aoAfa + GEB_AFA + fgWrite;
  const matAuf = matUsedVal + bs;
  const ebit = U + dBest - matAuf - personal - afa - sonst;
  // --- Finanzierung (iterativ, ÜK-Zins hängt vom ÜK ab)
  const kkInt = D.kk*P.kkRate, wpInt = D.wp*P.wpRate;
  const lks = (S.lks||[]).map(l=>({...l}));
  if (D.lk>0) lks.push({amount:D.lk, rate:P.lkRate, bal:D.lk, isNew:true});
  let lkTilg = 0, lkInt = 0;
  for (const l of lks){ lkInt += l.bal*l.rate; if (!l.isNew){ const t=Math.min(l.bal, l.amount/10); lkTilg+=t; l.bal-=t; } delete l.isNew; }
  const lkBal = lks.reduce((a,l)=>a+l.bal,0);
  const inNo = 0.8*(u1+u2) + ugA + S.receivables + desinvErl + D.kk + D.lk + S.wp + wpInt;
  const persCash = personal - pens;
  const div = Math.min(D.div, S.vortrag);
  if (D.div > S.vortrag+1e-9) W.push(['warn','Dividende über Gewinnvortrag',`Maximal ${fmt(S.vortrag,2)} MEUR.`]);
  let uek = 0, tax = 0, ebt = 0, uekInt = 0, loss = S.lossCarry||0, lossNew = loss;
  for (let i=0;i<40;i++){
    uekInt = uek*P.uekRate;
    ebt = ebit + wpInt - kkInt - lkInt - uekInt;
    const taxable = ebt - loss;
    tax = taxable>0 ? taxable*P.tax : 0;
    lossNew = ebt<0 ? loss - ebt : Math.max(0, loss - ebt);
    const outNo = matPaidNow + S.payables + bs + persCash + sonst + S.uek + S.kk + lkTilg + kkInt + lkInt + invest + D.wp + div + tax;
    const gap = outNo + uekInt - inNo - S.cash + MIN_CASH;
    const next = Math.max(0, gap);
    if (Math.abs(next-uek) < 1e-7){ uek = next; break; }
    uek = next;
  }
  uekInt = uek*P.uekRate;
  const outNo = matPaidNow + S.payables + bs + persCash + sonst + S.uek + S.kk + lkTilg + kkInt + lkInt + invest + D.wp + div + tax;
  const inTot = inNo + uek, outTot = outNo + uekInt;
  const cashEnd = S.cash + inTot - outTot;
  const jue = ebt - tax;
  // --- Bilanz
  const geb = S.gebaeude - GEB_AFA;
  const machEnd = machines.map(m=>{ const n={...m}; if (n.rl>0){ n.rbw=Math.max(0,n.rbw-n.afa); n.rl-=1; } delete n.isNew; return n; });
  const av = geb + machEnd.reduce((a,m)=>a+m.rbw,0);
  const recEnd = 0.2*(u1+u2);
  const uv = matEndVal + fgEndVal + recEnd + D.wp + cashEnd;
  const vortragEnd = S.vortrag - div + jue;
  const ek = FIX_EQ + vortragEnd;
  const pensionEnd = S.pension + pens;
  const fk = uek + D.kk + lkBal + payablesEnd;
  const bsum = av + uv;
  const diff = bsum - (ek + pensionEnd + fk);
  const ekq = ek/bsum;
  const rating = ratingFor(ekq, jue, uek/bsum);
  if (ekq < 0.4) W.push(['warn',`Eigenkapitalquote ${fmt(ekq*100,0)} %`,`Rating-Tendenz ${rating}. Ein schlechteres Rating erhöht die Zinsen der Folgeperiode.`]);
  const planDev = D.plan>0 ? (s1-D.plan)/D.plan : null;
  if (planDev!==null && Math.abs(planDev) > 0.05) W.push(['warn',`Planwert weicht ${fmt(planDev*100,1)} % ab`,`Erwarteter Absatz Markt 1: ${fmt(s1,0)} Stk, Planwert ${fmt(D.plan,0)} Stk. Die Planungsqualität beeinflusst Rating und Aktienkurs.`]);
  const plan2 = D.plan2||0;
  const planDev2 = plan2>0 ? (s2-plan2)/plan2 : (s2>0 ? 1 : null);
  if (plan2>0 && !D.m2) W.push(['warn','Planwert Markt 2 ohne Aktivität',`Planwert ${fmt(plan2,0)} Stk, aber Markt 2 ist nicht aktiv. Erwarteter Absatz 0.`]);
  else if (D.m2 && plan2===0) W.push(['warn','Planwert Markt 2 fehlt',`Erwarteter Absatz Markt 2: ${fmt(s2,0)} Stk. Bitte als Planwert eintragen.`]);
  else if (planDev2!==null && Math.abs(planDev2) > 0.05) W.push(['warn',`Planwert Markt 2 weicht ${fmt(planDev2*100,1)} % ab`,`Erwarteter Absatz Markt 2: ${fmt(s2,0)} Stk, Planwert ${fmt(plan2,0)} Stk.`]);
  if (fgEnd > 3000) W.push(['warn',`Fertiglager ${fmt(fgEnd,0)} Stk`,'Lagerkosten 100 EUR/Stk; Altgeräte senken die Kundenzufriedenheit.']);
  // --- Ergebnisobjekt
  Object.assign(R, {
    techG1, techG2, tech, machines, machEnd, sold, desinvErl, aoAfa, invest, machCap, afaMach, machFix, uiAvg, umwelt, ratIdx,
    fertEnd, newShare, einarb, prozIdx, qualIdx, prodI, prodPerMA, fehl, einsetzbar, capUnit, maxMach, maxStaff, prod, needMA, otMA, otUsed, otCost,
    auslMA: einsetzbar>0? needMA/einsetzbar:0, auslMach: machCap>0? prod*capUnit/machCap:0,
    pAvg, share, base, d1, d2, p2eur, ga, s1, s2, sold_, unmet1, unmet2, u1, ugA, u2, U, avail,
    dept, loehne, sumL, hireCost, fireCost, trainCost, sozial, nk, pens, personal,
    matNeed, order, price, short, shortPrice, purchase, matUsedVal, matEnd, matEndVal, matPaidNow, payablesEnd, bs,
    instM, instVw, nach, advTot, mafo, feBer, transport, lagerFE, lagerM, otFix, sonst,
    hkEinkauf, hkFert, hk, hkUnit, avgFG, cogs, fgEnd, fgEndVal, dBest, fgWrite, afa, matAuf, ebit,
    kkInt, wpInt, lkInt, lkTilg, uekInt, ebt, tax, jue, uek, inNo, inTot, outTot, cashEnd, div,
    geb, av, recEnd, uv, ek, pensionEnd, fk, lkBal, bsum, diff, ekq, rating, planDev, planDev2, warnings: W
  });
  // --- Endzustand = Start der Folgeperiode
  R.end = {
    product: gen2?'G2':'G1', fgStock:fgEnd, fgValue:fgEndVal, matStock:matEnd, matValue:matEndVal, receivables:recEnd, payables:payablesEnd,
    cash:cashEnd, uek, kk:D.kk, wp:D.wp, lks, vortrag:vortragEnd, pension:pensionEnd, lossCarry:lossNew,
    staff:{fert:fertEnd, fe:feEnd, vt:vtEnd, ek:ekEnd, vw:vwEnd}, prevRevenue:U,
    machines:machEnd, gebaeude:geb, techG1, techG2, cumProd:S.cumProd+prod, ratIdx, prozIdx, marketBase
  };
  return R;
}

function fmt(x, d=1){
  if (x===null || x===undefined || !isFinite(x)) return '–';
  const neg = x<0; x = Math.abs(x);
  let s = x.toFixed(d); let [i,f] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (neg?'−':'') + i + (f?'.'+f:'');
}

const GROWTH = {P1:0, P2:-0.01};      // Marktwachstum Markt 1: P1 in der Basis enthalten, P2 «stabil, leichte Einbussen»
function inflOf(k){ for (let i=+k.slice(1); i>=1; i--){ if (INFL['P'+i]!==undefined) return INFL['P'+i]; } return 0.02; }
function compFor(k){
  if (COMP_HIST[k]) return COMP_HIST[k];
  const i = +k.slice(1), a = compFor('P'+(i-1)), b = compFor('P'+(i-2));
  return {cP: a.cP*(1+0.93*inflOf(k)), cW: a.cW + 0.5*(a.cW-b.cW), cV: a.cV + 0.5*(a.cV-b.cV), cT: a.cT + (a.cT-b.cT)};

    const base = k==='P1' ? parP1() : k==='P2' ? parP2() : {...parP2(), gaMax:0, oneOff:0};

function rdSource(key, k){
  const n = pnum(k);
  if (key==='kkRate' || key==='lkRate') return n>=4 ? 'Annahme (Zins noch nicht bekannt) + Rating-Zuschlag HB 3.6.4' : 'Annahme, Kredite erst ab P4';
  if (key==='uekRate' && n>=4) return 'Prognose P2 + Rating-Zuschlag der Vorperiode (HB 3.6.4)';
  if (CALIB_KEYS.includes(key)) return 'aus Bericht P1 abgeleitet';
  if (n===1 && ['bsG2','tr2','fx','machCat.B.price'].includes(key)) return 'erst ab P2 relevant';
  if (n===1 && key==='uekRate') return 'aus Bericht P1 abgeleitet (0.65 / 10.83)';
  if (n>=3 && (key==='gaMax' || key==='oneOff')) return 'nur in P2 (keine Angabe für diese Periode)';
  if (n>=2 && WP2_KEYS.includes(key)) return n===2 ? 'Wirtschaftsprognose P2' : 'Prognose P2 (gilt weiter)';
  if (n>=1 && WP1_KEYS.includes(key)) return n===1 ? 'Wirtschaftsprognose P1' : 'Prognose P1 (gilt weiter)';

function kpiFor(k){

const CHARTS = [['Umsatz','U','MEUR',1],['Betriebsergebnis','ebit','MEUR',1],['Periodenüberschuss','jue','MEUR',1],['Absatz gesamt','sold_','Stk',0],['Überziehungskredit','uek','MEUR',1],['Fremdkapitalquote','fkq','%',0,'pct']];
function lineChart(title, unit, pts, d, kind){
  const W=320, H=170, L=44, R=12, T=22, B=24;
  const vals = pts.map(p=>kind==='pct'?p.v*100:p.v);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals); if (hi===lo) hi = lo+1; hi = hi*1.12;
  const x = i => L + (pts.length>1 ? i*(W-L-R)/(pts.length-1) : (W-L-R)/2);
  const y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks = [lo, lo+(hi-lo)/2, hi].map(v=>+v.toFixed(d));
  const path = vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = path + `L${x(vals.length-1).toFixed(1)},${y(lo).toFixed(1)}L${x(0).toFixed(1)},${y(lo).toFixed(1)}Z`;
  const last = vals.length-1;
  return `<div class="chart"><h3>${esc(title)} (${esc(unit)})</h3>
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)} je Periode">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-6}" y="${y(t)+4}" text-anchor="end">${fmt(t,d)}</text>`).join('')}
    <line class="base" x1="${L}" x2="${W-R}" y1="${y(lo)}" y2="${y(lo)}"/>
    <path class="ar" d="${area}" opacity=".5"/><path class="ln" d="${path}"/>
    ${pts.map((p,i)=>`<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${p.k}</text>`).join('')}
    ${vals.map((v,i)=>`<circle class="pt ${pts[i].src==='sim'?'sim':''}" cx="${x(i)}" cy="${y(v)}" r="4.5"/>`).join('')}
    <text class="lbl" x="${Math.min(x(last), W-R-2)}" y="${y(vals[last])-9}" text-anchor="${last?'end':'middle'}">${fmt(vals[last],d)}</text>
    ${vals.map((v,i)=>`<rect class="hit" x="${x(i)-14}" y="${T-10}" width="28" height="${H-T-B+20}" data-tip="${pts[i].k}: ${fmt(v,d)} ${unit} · ${SRC_TXT[pts[i].src]}"/>`).join('')}
  </svg></div>`;
}

    ['Einsatzstoffe', fmt(r.matUsedVal,2)],['Betriebsstoffe', fmt(r.bs,2)],['Löhne/Gehälter (mit Überstunden)', fmt(r.sumL,2)],['Einstellungen/Entlassungen/Training', fmt(r.hireCost+r.fireCost+r.trainCost,2)],['Kosten Sozialplan', fmt(r.sozial,2)],
    ['Personalnebenkosten', fmt(r.nk,2)],['Pensionsrückstellungen', fmt(r.pens,2)],['Abschreibung Gebäude', fmt(1,2)],['Abschreibung Fertigungsanlagen (inkl. Verkauf)', fmt(r.afaMach+r.aoAfa,2)],['Abschreibung Fertigerzeugnisse', fmt(r.fgWrite,2)],
    ['Sonstige fixe Kosten', fmt(r.machFix+r.otFix,2)],['Instandhaltung/Rationalisierung/ERP', fmt(r.instM+r.instVw+D.ratA+D.ratB+P.oneOff,2)],['Prozessoptimierung', fmt(D.prozOpt,2)],['Umweltabgabe', fmt(r.umwelt,2)],['Nacharbeit/Ausschuss', fmt(r.nach,2)],
    ['Lagerkosten', fmt(r.lagerFE+r.lagerM,2)],['Werbung/Marktforschung/Corporate Identity', fmt(r.advTot+r.mafo+D.ci,2)],['Sonstige Kosten F&E (Beratung)', fmt(r.feBer,2)],['Transportkosten', fmt(r.transport,2)],{cls:'sum',c:['Summe', fmt(cc.total,2)]}])}</section>`;
  // --- TNB09 Kostenträger
  h += `<section class="page">${repHead('TNB09','Kostenträgerrechnung',k)}${tbl(['','Gesamt (MEUR)','Je Stück (EUR)'],[
    ['Einkauf (Material, Betriebsstoffe, Kostenstelle)', fmt(r.hkEinkauf,2), fmt(r.prod?r.hkEinkauf/r.prod*1e6:0,2)],['Fertigung (Personal, Anlagen, Umwelt, Nacharbeit)', fmt(r.hkFert,2), fmt(r.prod?r.hkFert/r.prod*1e6:0,2)],
    {cls:'sum',c:['= Herstellkosten der Fertigung', fmt(r.hk,2), fmt(r.hkUnit,2)]},['Herstellkosten des Umsatzes', fmt(r.cogs,2), fmt(r.sold_?r.cogs/r.sold_*1e6:0,2)],
    ['+ F&E', fmt(cc.fe,2), fmt(cc.fe/r.sold_*1e6,2)],['+ Vertrieb', fmt(cc.vt,2), fmt(cc.vt/r.sold_*1e6,2)],['+ Verwaltung', fmt(cc.vw,2), fmt(cc.vw/r.sold_*1e6,2)],['+ Übrige', fmt(cc.rest,2), fmt(cc.rest/r.sold_*1e6,2)],
    {cls:'res',c:['= Selbstkosten', fmt(r.cogs+cc.fe+cc.vt+cc.vw+cc.rest,2), fmt((r.cogs+cc.fe+cc.vt+cc.vw+cc.rest)/r.sold_*1e6,2)]}])}</section>`;
  // --- TNB10 DB
  const ch = [['Markt 1', r.s1, r.u1, r.s1*P.tr1/1e6],['Grossabnehmer', r.ga, r.ugA, 0],['Markt 2', r.s2, r.u2, r.s2*P.tr2/1e6]].filter(c=>c[1]>0);
  const db = ch.map(([n,q,u,t])=>({n,q,u,t,hk:q*r.avgFG, d:u-q*r.avgFG-t}));
  const dbSum = db.reduce((a,x)=>a+x.d,0);
  h += `<section class="page">${repHead('TNB10','Deckungsbeitragsrechnung',k)}${tbl(['','Stk','Umsatz','− Herstellkosten des Umsatzes','− Transport','= Deckungsbeitrag','DB je Stück (EUR)'],
    db.map(x=>[x.n, fmt(x.q,0), fmt(x.u,2), fmt(x.hk,2), fmt(x.t,2), fmt(x.d,2), fmt(x.d/x.q*1e6,2)]).concat([{cls:'sum',c:['Summe', fmt(r.sold_,0), fmt(r.U,2), fmt(r.cogs,2), fmt(r.transport,2), fmt(dbSum,2), fmt(dbSum/r.sold_*1e6,2)]}]))}
    ${tbl(['Vom Deckungsbeitrag zum Betriebsergebnis','MEUR'],[['Deckungsbeitrag nach Herstellkosten', fmt(dbSum,2)],['− F&E', fmt(cc.fe,2)],['− Vertrieb (ohne Transport)', fmt(cc.vt-r.transport,2)],['− Verwaltung', fmt(cc.vw,2)],['− Übrige', fmt(cc.rest,2)],
      {cls:'res',c:['= Betriebsergebnis', fmt(dbSum-cc.fe-(cc.vt-r.transport)-cc.vw-cc.rest,2)]}])}</section>`;
  // --- TNB11 GuV
  h += `<section class="page">${repHead('TNB11','Gewinn- und Verlustrechnung',k)}<div class="two">${tbl(['Gesamtkostenverfahren','MEUR','% Umsatz'],[
    ['Umsatzerlöse', fmt(r.U,2), '100.00'],['± Bestandsveränderung Fertigerzeugnisse', fmt(r.dBest,2), fmt(r.dBest/r.U*100,2)],['− Materialaufwand', fmt(r.matAuf,2), fmt(r.matAuf/r.U*100,2)],['− Personalaufwand', fmt(r.personal,2), fmt(r.personal/r.U*100,2)],
    ['− Abschreibungen', fmt(r.afa,2), fmt(r.afa/r.U*100,2)],['− Sonstiger Aufwand', fmt(r.sonst,2), fmt(r.sonst/r.U*100,2)],{cls:'res',c:['= Betriebsergebnis', fmt(r.ebit,2), fmt(r.ebit/r.U*100,2)]},
    ['+ Erträge aus Wertpapieren', fmt(r.wpInt,2), ''],['− Zinsen Kredite', fmt(r.kkInt+r.lkInt,2), ''],['− Zinsen Überziehungskredit', fmt(r.uekInt,2), ''],{cls:'sum',c:['= Gewinn vor Steuern', fmt(r.ebt,2), fmt(r.ebt/r.U*100,2)]},
    ['− Steuern', fmt(r.tax,2), ''],{cls:'res',c:['= Periodenüberschuss', fmt(r.jue,2), fmt(r.jue/r.U*100,2)]}])}
    ${tbl(['Umsatzkostenverfahren','MEUR'],[['Umsatzerlöse', fmt(r.U,2)],['− Herstellkosten des Umsatzes', fmt(r.cogs,2)],['− F&E', fmt(cc.fe,2)],['− Vertrieb', fmt(cc.vt,2)],['− Verwaltung', fmt(cc.vw,2)],['− Übrige', fmt(cc.rest,2)],{cls:'res',c:['= Betriebsergebnis', fmt(r.ebit,2)]},
      {cls:'sum',c:['Ergebnisverwendung','']},['Gewinnvortrag Vorperiode', fmt(S.vortrag,2)],['− Dividende', fmt(r.div,2)],['+ Periodenüberschuss', fmt(r.jue,2)],{cls:'res',c:['= Gewinnvortrag', fmt(S.vortrag-r.div+r.jue,2)]}])}</div></section>`;
  // --- TNB12 Liquidität
  h += `<section class="page">${repHead('TNB12','Liquiditätsrechnung',k)}${tabContent('liq', k, S, r, state.periods[k])}</section>`;
  // --- TNB14 Cashflow
  const tradCF = r.jue + r.afa + r.pens;
  const dMat = S.matValue - r.matEndVal, dFG = (S.fgValue - r.fgWrite) - r.fgEndVal, dRec = S.receivables - r.recEnd, dPay = r.payablesEnd - S.payables;
  const opCF = tradCF + dMat + dFG + dRec + dPay, invCF = -r.invest + r.desinvErl;
  const finCF = (r.uek + D.kk + r.lkBal) - (S.uek + S.kk + (S.lks||[]).reduce((a,l)=>a+l.bal,0)) - r.div + (S.wp - D.wp);
  h += `<section class="page">${repHead('TNB14','Cashflow Statement',k)}${tbl(['','MEUR'],[['Periodenüberschuss', fmt(r.jue,2)],['+ Abschreibungen', fmt(r.afa,2)],['+ Erhöhung Pensionsrückstellungen', fmt(r.pens,2)],{cls:'sum',c:['= Traditioneller Cashflow', fmt(tradCF,2)]},
    ['± Vorräte Materialien', fmt(dMat,2)],['± Vorräte Fertigerzeugnisse', fmt(dFG,2)],['± Forderungen', fmt(dRec,2)],['± Verbindlichkeiten Lieferanten', fmt(dPay,2)],{cls:'sum',c:['A. Operativer Cashflow', fmt(opCF,2)]},
    ['Investitionen in Anlagen', fmt(-r.invest,2)],['Verkauf von Anlagen', fmt(r.desinvErl,2)],{cls:'sum',c:['B. Cashflow aus Investitionen', fmt(invCF,2)]},
    ['± Bankverbindlichkeiten', fmt(finCF + r.div - (S.wp - D.wp),2)],['− Dividende', fmt(r.div,2)],['± Wertpapiere', fmt(S.wp - D.wp,2)],{cls:'sum',c:['C. Cashflow aus Finanzierung', fmt(finCF,2)]},
    {cls:'res',c:['D. Veränderung Kasse (A+B+C)', fmt(opCF+invCF+finCF,2)]},['Free Cashflow (A+B)', fmt(opCF+invCF,2)]])}</section>`;
  // --- TNB15 Bilanz
  h += `<section class="page">${repHead('TNB15','Bilanz',k)}${tabContent('bilanz', k, S, r, state.periods[k])}</section>`;
  // --- TNB18 Kennzahlen
  const ekPrev = FIX_EQ + S.vortrag;
  h += `<section class="page">${repHead('TNB18','Wertorientierte Kennzahlen',k)}${cmpTbl([
    ['Eigenkapital','MEUR',pv.ek,r.ek,2],['Eigenkapitalquote','%',pv.ekq!=null?pv.ekq*100:null,r.ekq*100,2],['Eigenkapitalrendite (JÜ / EK Vorperiode)','%',null,r.jue/ekPrev*100,2],
    ['Fremdkapitalquote','%',pv.ekq!=null?(1-pv.ekq)*100:null,(1-r.ekq)*100,2],['EBIT','MEUR',pv.ebit,r.ebit,2],['EBITDA','MEUR',pv.ebit!=null&&pv.afa!=null?pv.ebit+pv.afa:null,r.ebit+r.afa,2],
    ['EBITDA-Marge','%',pv.ebit!=null&&pv.afa!=null&&pv.U?(pv.ebit+pv.afa)/pv.U*100:null,(r.ebit+r.afa)/r.U*100,2],['Umsatzrendite','%',pv.U?pv.jue/pv.U*100:null,r.jue/r.U*100,2],['Free Cashflow','MEUR',null,opCF+invCF,2]],k)}</section>`;
  // --- TNB19 Entscheidungsprotokoll
  const prot = [['Preis Markt 1','EUR','price',0],['Werbung Markt 1','MEUR','adv',2],['Vertriebspersonal Markt 1','MA','vt1',0],['Aktiv auf Markt 2','','m2','b'],['Preis Markt 2','FCU','p2',0],['Vertriebspersonal Markt 2','MA','vt2',0],
    ['Corporate Identity','MEUR','ci',2],['Marktforschungsbericht','','mafo','b'],['Grossabnehmer','Stk','ga',0],['F&E-Personal Gen. 1','MA','feG1',0],['F&E-Personal Gen. 2','MA','feG2',0],['Ökologie Gen. 1','MEUR','oekoG1',2],['Ökologie Gen. 2','MEUR','oekoG2',2],
    ['Lieferant','','supplier','s'],['Bestellmenge','Stk','order',0],['Fertigungsmenge','Stk','prod',0],['Neue Anlagen Typ A','Stk','buyA',0],['Neue Anlagen Typ B','Stk','buyB',0],['Desinvestition','','sell','l'],
    ['Einstellungen Fertigung','MA','hires',0],['Entlassungen Fertigung','MA','fires',0],['Planwert Markt 1','Stk','plan',0],['Planwert Markt 2','Stk','plan2',0]].filter(([_,__,f])=>availIn(f,k));
  const pf = (o,f,d) => { const v=o[f]; if (v===undefined) return '–'; if (d==='b') return v?'Ja':'Nein'; if (d==='l') return (v&&v.length)?v.join(', '):'–'; if (d==='s') return v===0?'Altvertrag':'Lieferant '+v; return fmt(v,d); };
  h += `<section class="page">${repHead('TNB19','Entscheidungsprotokoll',k)}${tbl(['Entscheid','Einheit','Periode '+prevOf(k).slice(1),'Periode '+k.slice(1)], prot.map(([l,u,f,d])=>[esc(l), esc(u), pf(pd,f,d), pf(D,f,d)]))}</section>`;
  h += `</div>`;
  return h;
}
function viewReports(){
  const k = state.cur;
  if (k==='P0') return `<div class="vh"><h1>Berichtswesen</h1><p>Periode 0 · Ist aus dem Sammelbericht</p></div>` + p0Report();
  const mode = state.repMode || 'einzel';
  const head = `<div class="vh no-print"><h1>Berichtswesen</h1><p>Periode ${k.slice(1)} · ${k==='P1'?'Modell, Vergleich mit Ist im Tab «Plan gegen Ist»':'Simulation'}</p></div>
    <div class="row-actions no-print"><button class="btn ${mode==='einzel'?'primary':''}" data-rep="einzel">Einzelberichte</button><button class="btn ${mode==='sammel'?'primary':''}" data-rep="sammel">Sammelbericht (Simulation)</button>
    ${mode==='sammel'?`<button class="btn" id="btn-print">Drucken / als PDF speichern</button><span class="note" id="print-msg"></span>`:''}</div>`;
  if (mode==='sammel') return head + sammelbericht(k);
  return head + `<div class="results" id="results"></div>`;
}

/* ---------- Ansicht: Entscheidungen ---------- */
function viewDecisions(){
  const k = state.cur;
  if (k==='P0') return `<div class="vh"><h1>Entscheidungen</h1><p>Periode 0 · Ausgangslage, keine eigenen Entscheide</p></div>`+
    tbl(['Entscheidungsprotokoll P0','Wert'],[['Preis Markt 1','3\'000 EUR'],['Werbung Markt 1','6.00 MEUR'],['Vertriebsmitarbeitende','100'],['F&E-Personal','35'],['Fertigungsmenge','40\'000 Stk'],['Einstellungen Fertigung','50'],['Marktforschungsbericht','ja']])+
    `<p class="note">Eure ersten Entscheide stehen in Periode 1.</p>`;
  return `<div class="vh"><h1>Entscheidungen</h1><p>Periode ${k.slice(1)}${k==='P1'?' · Test mit euren echten P1-Entscheiden':''}</p></div>
  <div class="grid"><aside class="panel decisions" id="decisions" aria-label="Entscheide und Annahmen"></aside><div class="results" id="results"></div></div>`;
}

function renderView(){
  const v = state.view, k = state.cur;
  const html = v==='news' ? viewNews() : v==='charts' ? viewCharts() : v==='reports' ? viewReports() : v==='decisions' ? viewDecisions() : viewInfohub();
  $('#view').innerHTML = html;
  if (k!=='P0'){
    if (v==='decisions'){ renderDecisions(); renderResults('compact'); }
    if (v==='reports') renderResults('full');
  }
}
function renderAll(){ runAll(); renderPeriods(); renderNav(); renderView(); }
function refreshResults(){ runAll(); if (state.view==='decisions' || state.view==='reports') renderResults(); else renderView(); }

/* ---------- Ereignisse ---------- */
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset.k){
    const p = state.periods[state.cur]; const obj = t.dataset.scope==='dec' ? p.dec : p.par;
    let v;
    if (t.type==='checkbox') v = t.checked;
    else if (t.dataset.sel) v = isNaN(+t.value) ? t.value : +t.value;
    else { if (t.value==='' || !isFinite(+t.value)) return; v = +t.value; if (t.dataset.pct) v = v/100; }
    setPath(obj, t.dataset.k, v); save(); refreshResults();
  } else if (t.dataset.sell){
    const d = state.periods[state.cur].dec; d.sell = d.sell||[];
    if (t.checked && !d.sell.includes(t.dataset.sell)) d.sell.push(t.dataset.sell);
    if (!t.checked) d.sell = d.sell.filter(x=>x!==t.dataset.sell);
    save(); refreshResults();
  } else if (t.dataset.ist){
    const p = state.periods[state.cur]; p.ist = p.ist||{};
    if (t.value==='') delete p.ist[t.dataset.ist]; else p.ist[t.dataset.ist] = +t.value;
    save(); refreshResults();
  }
});
document.addEventListener('change', e=>{ if (e.target.dataset.sel || e.target.type==='checkbox') e.target.dispatchEvent(new Event('input',{bubbles:true})); });
document.addEventListener('toggle', e=>{
  const d = e.target; if (!d.matches || !d.matches('details.grp')) return;
  const open = JSON.parse(sessionGet('open')||'{}'); open[d.dataset.key] = d.open; sessionSet('open', JSON.stringify(open));
}, true);
document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.period){
    const k = b.dataset.period, i = PERIODS.indexOf(k);
    for (let j=1;j<=i;j++) ensurePeriod(PERIODS[j]);
    state.cur = k; resetArmed = false; save(); renderAll(); return;
  }
  if (b.dataset.view){
    state.view = b.dataset.view; resetArmed = false; save(); renderNav(); renderView();
    $('#side').classList.remove('open'); $('#menu').setAttribute('aria-expanded','false'); window.scrollTo(0,0); return;
  }
  if (b.id==='menu'){
    if (window.matchMedia('(max-width:800px)').matches){ const o = $('#side').classList.toggle('open'); b.setAttribute('aria-expanded', String(o)); }
    else { const c = document.querySelector('.shell').classList.toggle('collapsed'); b.setAttribute('aria-expanded', String(!c)); }
    return;
  }
  if (b.id==='btn-team-reset'){ state.team = {}; save(); renderView(); return; }
  if (b.dataset.rep){ state.repMode = b.dataset.rep; save(); renderView(); return; }
  if (b.id==='btn-print'){
    let ok = true; try { window.print(); } catch(err){ ok = false; }
    const inFrame = window.self !== window.top;
    $('#print-msg').innerHTML = inFrame || !ok ? 'Hier ist Drucken gesperrt. Auf <a href="https://raphaelrua.github.io/Helvetic-Print-Simulator/" target="_blank" rel="noopener">der GitHub-Seite</a> öffnen und dort drucken (Ziel: «Als PDF speichern»).' : 'Im Druckdialog «Als PDF speichern» wählen.';
    return;
  }
  if (b.dataset.tab){ state.tab = b.dataset.tab; save(); renderResults(); return; }
  if (b.id==='btn-var'){
    const name = ($('#var-name').value||'').trim() || `Variante ${state.variants.filter(v=>v.period===state.cur).length+1}`;
    const r = cache[state.cur].r;
    state.variants.push({period:state.cur, name, dec:clone(state.periods[state.cur].dec), par:clone(state.periods[state.cur].par),
      kpi:{sold_:r.sold_, U:r.U, ebit:r.ebit, jue:r.jue, uek:r.uek, ekq:r.ekq, hkUnit:r.hkUnit}});
    save(); renderResults(); return;
  }
  if (b.dataset.load!==undefined){ const v = state.variants[+b.dataset.load]; state.periods[v.period].dec = clone(v.dec); state.periods[v.period].par = clone(v.par); save(); renderAll(); return; }
  if (b.dataset.del!==undefined){ state.variants.splice(+b.dataset.del,1); save(); renderResults(); return; }
  if (b.id==='btn-export'){
    const txt = JSON.stringify(state); const ta = $('#io-text'); ta.value = txt;
    const done = ()=>{ $('#io-msg').textContent = 'Daten kopiert. Auf dem anderen Gerät einfügen und laden.'; };
    try { navigator.clipboard.writeText(txt).then(done, ()=>{ ta.select(); $('#io-msg').textContent = 'Text markiert: mit Ctrl+C kopieren.'; }); }
    catch(err){ ta.select(); $('#io-msg').textContent = 'Text markiert: mit Ctrl+C kopieren.'; }
    return;
  }
  if (b.id==='btn-import'){
    try { const o = JSON.parse($('#io-text').value); if (!o.periods || !o.periods.P1) throw new Error(); state = o; save(); renderAll(); $('#io-msg').textContent = 'Daten geladen.'; }
    catch(err){ $('#io-msg').textContent = 'Das sind keine gültigen Simulator-Daten. Bitte den kopierten Text vollständig einfügen.'; }
    return;
  }
  if (b.id==='btn-reset-p'){
    const k = state.cur; const d = defaultState();
    if (d.periods[k]) state.periods[k] = d.periods[k]; else { delete state.periods[k]; ensurePeriod(k); }
    save(); renderAll(); return;
  }
});
let resetArmed = false;
document.addEventListener('input', e=>{
  const t = e.target; if (!t.dataset || !t.dataset.team) return;
  state.team = state.team || {}; state.team[t.dataset.team] = t.value; save();
});
document.addEventListener('change', e=>{
  const t = e.target; if (t.id!=='team-logo' || !t.files || !t.files[0]) return;
  const f = t.files[0];
  if (f.size > 300000){ t.value=''; t.insertAdjacentHTML('afterend','<span class="note">Bild ist zu gross (max. 300 KB).</span>'); return; }
  const rd = new FileReader(); rd.onload = ()=>{ state.team = state.team || {}; state.team.logo = rd.result; save(); renderView(); }; rd.readAsDataURL(f);
});
document.addEventListener('mousemove', e=>{
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if (!t){ tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX+12, window.innerWidth-tip.offsetWidth-8)+'px'; tip.style.top = (e.clientY-34)+'px';
});
renderAll();
</script>
